<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Jéssica Mariano">
<meta name="robots" content="noindex, nofollow">
<title>Orbit — Jéssica Mariano</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b0f14'/><circle cx='16' cy='16' r='11' fill='none' stroke='%236fa8dc' stroke-width='1' opacity='0.4'/><circle cx='16' cy='16' r='7' fill='none' stroke='%236fa8dc' stroke-width='1.4' opacity='0.7'/><circle cx='16' cy='16' r='3.2' fill='%232f80d0'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;500;600&family=Inter:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b0f14; --surface-1:#11161d; --surface-2:#161d26; --surface-3:#1c2430;
    --border:#1e2732; --border2:#2a3644; --border3:#38495a;
    --t-1:#e7eaed; --t-2:#abb1b8; --t-3:#6b727a; --t-muted:#4f565e;
    --blue:#2f80d0; --blue-deep:#2666a6; --blue-soft:#5999d9; --blue-ink:#1c4d7d;
    --green:#3fa66b; --red:#c65a52; --amber:#cba14e; --purple:#8a6fb0; --orange:#c47a4e;
    --f-h:'Plus Jakarta Sans',sans-serif; --f-b:'Inter',sans-serif; --f-m:'IBM Plex Mono',monospace;
    --r-sm:6px; --r-md:10px; --r-lg:14px; --r-full:9999px;
    --shadow-md:0 4px 16px rgba(0,0,0,.5); --shadow-lg:0 14px 40px rgba(0,0,0,.55);
    --ease:cubic-bezier(.16,1,.3,1); --smooth:cubic-bezier(.4,0,.2,1);
  }
  :root[data-theme="light"]{
    --ink:#f5f7f9; --surface-1:#ffffff; --surface-2:#eef2f6; --surface-3:#e3e9ef;
    --border:#dde4ea; --border2:#cbd5df; --border3:#aab7c4;
    --t-1:#23282d; --t-2:#4f565e; --t-3:#6b727a; --t-muted:#8b9199;
    --shadow-md:0 4px 16px rgba(28,77,125,.10); --shadow-lg:0 14px 40px rgba(28,77,125,.14);
  }
  :root[data-theme="light"] .topbar{background:rgba(245,247,249,.82)}
  html{transition:background .3s var(--smooth),color .3s var(--smooth)}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--ink);color:var(--t-1);font-family:var(--f-b);min-height:100vh}
  body{
    background:var(--ink);
    -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    cursor:none;overflow-x:hidden;
  }
  ::selection{background:transparent}

  /* ===== AURORA ===== */
  .aurora{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:hidden}
  .aurora::before,.aurora::after{content:"";position:absolute;border-radius:50%;filter:blur(120px);opacity:.07;animation:auroraMove 18s var(--smooth) infinite alternate}
  .aurora::before{width:900px;height:500px;background:radial-gradient(ellipse,rgba(47,128,208,.6),rgba(138,111,176,.3),transparent 70%);top:-20%;left:-10%}
  .aurora::after{width:700px;height:400px;background:radial-gradient(ellipse,rgba(63,166,107,.4),rgba(47,128,208,.3),transparent 70%);bottom:-15%;right:-10%;animation-delay:-9s;animation-duration:22s}
  :root[data-theme="light"] .aurora::before,:root[data-theme="light"] .aurora::after{opacity:.04}
  @keyframes auroraMove{0%{transform:translate(0,0) scale(1) rotate(0deg)}50%{transform:translate(80px,40px) scale(1.15) rotate(8deg)}100%{transform:translate(-40px,60px) scale(.95) rotate(-5deg)}}
  .aurora::before{animation-duration:25s}
  .aurora::after{animation-duration:31s}

  /* ===== CURSOR FOLLOWER ===== */
  .cursor{position:fixed;width:8px;height:8px;border-radius:50%;background:var(--blue);pointer-events:none;z-index:9999;
    transform:translate(-50%,-50%);transition:transform .2s var(--ease),opacity .2s var(--ease);opacity:0}
  .cursor.visible{opacity:1}
  .cursor.hover{transform:translate(-50%,-50%) scale(1.5)}
  :root[data-theme="light"] .cursor{background:var(--blue-deep)}
  @media(max-width:768px){.cursor{display:none}body{cursor:auto}}
  @media(pointer:coarse){.cursor{display:none}body{cursor:auto}}

  /* ===== ROW ENTRANCE (só no primeiro load via .anim-in) ===== */
  @keyframes rowSlide{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

  a{color:var(--blue-soft);text-decoration:none}

  /* ===== HEADER ===== */
  .topbar{position:sticky;top:0;z-index:40;background:rgba(11,15,20,.78);backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);padding:22px 40px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:18px}
  .no-mark{width:46px;height:46px;flex:none;position:relative}
  .no-mark svg{display:block;position:relative;z-index:1}
  .no-mark::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:112px;height:112px;border-radius:50%;
    background:radial-gradient(circle,rgba(47,128,208,.12),transparent 62%);pointer-events:none}
  .brand-txt .wordmark{font-family:var(--f-h);font-size:29px;font-weight:600;letter-spacing:-.03em;color:var(--t-1);line-height:1}
  .brand-txt .wordmark b{color:var(--blue)}
  .hbar-right{display:flex;flex-direction:row;align-items:center;gap:14px}
  .h3-status{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .live-line{font-family:var(--f-m);font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--green);display:inline-flex;align-items:center;gap:7px}
  .upd-line{font-family:var(--f-m);font-size:10px;letter-spacing:.06em;color:var(--t-3);text-transform:uppercase}
  .ghost-btn{width:38px;height:38px;flex:none;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--t-2);
    border:1px solid var(--border2);border-radius:var(--r-full);cursor:pointer;transition:all .18s var(--smooth)}
  .ghost-btn:hover{color:var(--blue-soft);border-color:var(--blue);background:rgba(47,128,208,.08)}
  .ghost-btn svg{width:17px;height:17px;display:block}
  .ghost-btn svg.i-sun{display:none}
  :root[data-theme="light"] .ghost-btn svg.i-moon{display:none}
  :root[data-theme="light"] .ghost-btn svg.i-sun{display:block}

  /* ===== LAYOUT ===== */
  .container{max-width:1200px;margin:0 auto;padding:32px 24px 8px;position:relative;z-index:5}
  .section-eyebrow{font-family:var(--f-m);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--t-muted);margin:0 0 14px 2px}

  /* ===== SCREEN NOTICE ===== */
  .screen-notice{position:fixed;bottom:1.5rem;right:1.5rem;left:auto;max-width:360px;width:calc(100% - 3rem);
    background:var(--ink);border:1px solid var(--border2);border-radius:var(--r-lg);padding:1.1rem 1.2rem;
    z-index:9980;box-shadow:0 12px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
    opacity:0;transform:translateY(12px);transition:opacity .35s var(--ease),transform .35s var(--ease);display:none}
  .screen-notice.visible{opacity:1;transform:none}
  .screen-notice-inner{display:flex;align-items:flex-start;gap:.85rem}
  .screen-notice-icon{width:30px;height:30px;flex-shrink:0;background:rgba(47,128,208,.12);
    border:1px solid rgba(47,128,208,.3);border-radius:8px;display:flex;align-items:center;justify-content:center;margin-top:.05rem}
  .screen-notice-icon svg{width:14px;height:14px;stroke:var(--blue-soft);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .screen-notice-body{flex:1;min-width:0}
  .screen-notice-title{font-family:var(--f-h);font-size:.86rem;font-weight:600;color:var(--t-1);letter-spacing:-.01em;margin-bottom:.25rem}
  .screen-notice-text{font-family:var(--f);font-size:.76rem;font-weight:400;line-height:1.6;color:var(--t-2)}
  .screen-notice-close{background:none;border:none;padding:.2rem;cursor:pointer;color:var(--t-3);flex-shrink:0;line-height:1;font-size:1rem;transition:color .15s;margin-top:-.1rem}
  .screen-notice-close:hover{color:var(--t-1)}



  /* ===== TABLE ===== */
  .table-wrap{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;margin-bottom:24px;overflow-x:auto}
  .table-wrap h3{font-family:var(--f-h);font-size:14px;font-weight:600;color:var(--t-1);margin-bottom:16px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed;min-width:1080px}
  col.c-lp{width:15%}col.c-sit{width:16%}col.c-acao{width:23%}col.c-etapas{width:26%}col.c-prog{width:20%}
  thead th{background:var(--surface-2);color:var(--t-muted);font-family:var(--f-m);font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:10px 16px;white-space:nowrap;border-bottom:1px solid var(--border2)}
  tbody td{padding:9px 16px;border-bottom:1px solid var(--border);color:var(--t-2);vertical-align:middle}
  /* Próxima ação: texto trunca no span interno; tooltip fica livre pra escapar */
  .td-acao{position:relative}
  .acao-txt{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .otip{position:absolute;left:16px;bottom:calc(100% + 6px);z-index:30;
    background:var(--surface-2);border:1px solid var(--border2);border-radius:var(--r-sm);
    padding:8px 11px;font-family:var(--f-b);font-size:12px;color:var(--t-1);line-height:1.5;
    white-space:normal;overflow-wrap:anywhere;word-break:break-word;max-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.5);
    opacity:0;transform:translateY(4px);transition:opacity .15s var(--ease),transform .15s var(--ease);pointer-events:none}
  .otip::after{content:"";position:absolute;top:100%;left:12px;border:5px solid transparent;border-top-color:var(--surface-2)}
  .td-acao.is-clipped:hover .otip{opacity:1;transform:translateY(0)}
  tbody td strong{color:var(--t-1);font-weight:600}
  tbody tr:hover{background:var(--surface-2)}
  tbody tr:last-child td{border-bottom:none}

  .badge{display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-m);font-size:9px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:4px 0;border-radius:var(--r-sm);border:1px solid transparent;width:140px;max-width:100%;text-align:center}
  .b-blue{background:rgba(47,128,208,.1);color:var(--blue-soft);border-color:rgba(47,128,208,.28)}
  .b-green{background:rgba(63,166,107,.1);color:var(--green);border-color:rgba(63,166,107,.28)}
  .b-amber{background:rgba(203,161,78,.1);color:var(--amber);border-color:rgba(203,161,78,.28)}
  .b-red{background:rgba(198,90,82,.1);color:var(--red);border-color:rgba(198,90,82,.28)}
  .b-purple{background:rgba(138,111,176,.12);color:var(--purple);border-color:rgba(138,111,176,.3)}
  .b-orange{background:rgba(196,122,78,.1);color:var(--orange);border-color:rgba(196,122,78,.28)}
  .b-gray{background:rgba(255,255,255,.04);color:var(--t-3);border-color:var(--border2)}

  .sub-line{display:block;font-size:10px;margin-top:4px;font-family:var(--f-m);letter-spacing:.03em}
  .sub-line.bloqueio{color:var(--red)}

  /* ===== MINI TRILHA O NÓ ===== */
  .trail-mini{display:flex;align-items:center;gap:0;min-width:200px}
  .tm{display:flex;align-items:center;position:relative;flex:1}
  .tm:last-child{flex:none}
  .tm:last-child .seg{display:none}
  .tm .nd{width:14px;height:14px;border-radius:50%;flex:none;background:var(--ink);border:1.5px solid var(--border3);transition:all .4s var(--ease);cursor:default}
  .tm.on .nd{background:var(--blue);border-color:var(--blue);box-shadow:0 0 6px rgba(47,128,208,.4)}
  .tm.no .nd{background:transparent;border-color:var(--red);border-style:dashed}
  .tm .seg{flex:1;height:1.5px;background:var(--border2);margin:0 3px}
  .tm.on .seg{background:var(--blue)}
  .tm .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
    font-family:var(--f-m);font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--t-1);
    background:var(--surface-2);border:1px solid var(--border2);border-radius:var(--r-sm);padding:3px 7px;
    white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s var(--smooth)}
  .tm:hover .tip{opacity:1}

  .pwrap{display:flex;align-items:center;gap:8px;min-width:110px}
  .pbar{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;min-width:50px}
  .pbar .fill{height:100%;border-radius:3px;transition:width .70s var(--ease)}
  .pct{font-family:var(--f-m);font-size:10px;font-weight:600;color:var(--t-3);min-width:24px;text-align:right;white-space:nowrap}
  tr.published td,tr.idle td{opacity:.45}

  /* ===== TOGGLE CHARTS ===== */
  /* ===== RESUMO VISUAL · 3 gráficos HTML ===== */
  .resumo-eyebrow{font-family:var(--f-m);font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--t-3);display:flex;align-items:center;gap:10px;margin:4px 0 16px}
  .resumo-eyebrow::before{content:"";width:22px;height:1px;background:var(--blue-deep)}
  .charts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
  .card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px}
  .card h3{font-family:var(--f-h);font-size:14px;font-weight:600;letter-spacing:-.01em;color:var(--t-1);margin-bottom:3px}
  .card-wide{grid-column:1 / -1}
  .ccap{font-family:var(--f-m);font-size:9.5px;letter-spacing:.05em;color:var(--t-3);margin-bottom:20px}
  .hbars{display:flex;flex-direction:column;gap:11px}
  .hb{display:grid;grid-template-columns:110px 1fr 20px;align-items:center;gap:8px}
  .hb-l{font-family:var(--f-m);font-size:9.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--t-2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hb-t{height:12px;background:var(--surface-3);border-radius:var(--r-full);overflow:hidden}
  .hb-f{height:100%;background:var(--blue);border-radius:var(--r-full);min-width:2px;transition:width .6s var(--ease)}
  .hb-f.ok{background:var(--green)}
  .hb-v{font-family:var(--f-m);font-size:11px;font-weight:500;color:var(--t-2);text-align:right}
  .scalehint{font-family:var(--f-m);font-size:8.5px;letter-spacing:.06em;color:var(--t-muted);text-transform:uppercase;margin-top:14px;text-align:right;white-space:nowrap}
  .mhead{display:grid;grid-template-columns:minmax(60px,1fr) auto 30px;gap:8px;margin-bottom:8px;align-items:end}
  .mhead .mdots-h{display:flex;gap:9px}
  .mhead .mdots-h span{width:15px;text-align:center;font-family:var(--f-m);font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--t-muted)}
  .mhead-r{font-family:var(--f-m);font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--t-muted);text-align:right}
  .mgrid{display:flex;flex-direction:column}
  .mrow{display:grid;grid-template-columns:minmax(60px,1fr) auto 30px;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
  .mrow:last-child{border-bottom:none}
  .mlp{font-family:var(--f-h);font-size:12.5px;font-weight:600;color:var(--t-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mdots{display:flex;gap:9px}
  .mcell .md{width:15px;height:15px;border-radius:50%;background:var(--ink);border:1.5px solid var(--border3);display:block}
  .mcell.on .md{background:var(--blue);border-color:var(--blue);box-shadow:0 0 6px rgba(47,128,208,.4)}
  .mcnt{font-family:var(--f-m);font-size:11px;font-weight:500;color:var(--t-2);text-align:right}
  .mrow.full .mcnt{color:var(--green)}
  .mrow.zero{opacity:.5}

  .loading{text-align:center;padding:80px 20px;color:var(--t-3)}
  .spinner{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 18px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes dotIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
  .fade{}

  /* ===== ENTRADA PREMIUM (reveal-on-scroll via .anim-in + .in-view) ===== */
  /* estado inicial: escondido até a seção entrar na viewport */
  .anim-in .table-wrap,.anim-in .resumo-eyebrow,.anim-in .charts-grid .card{opacity:0;transform:translateY(10px)}
  .anim-in .table-wrap tbody tr{opacity:0}
  .anim-in .table-wrap .fill,.anim-in .charts-grid .hb-f{transform:scaleX(0);transform-origin:left center}
  .anim-in .charts-grid .mcell{opacity:0}
  /* dispara quando entra em vista */
  .anim-in .table-wrap.in-view,.anim-in .resumo-eyebrow.in-view,.anim-in .charts-grid .card.in-view{
    animation:cardIn .58s var(--ease) both;will-change:opacity,transform}
  .anim-in .charts-grid .card:nth-child(2).in-view{animation-delay:.10s}
  .anim-in .charts-grid .card:nth-child(3).in-view{animation-delay:.20s}
  .anim-in .table-wrap.in-view tbody tr{animation:rowSlide .88s var(--ease) both}
  /* barras crescem da base (scaleX = GPU) ao revelar a seção */
  .anim-in .table-wrap.in-view .fill,.anim-in .charts-grid .card.in-view .hb-f{
    animation:growX 1.19s var(--ease) both;animation-delay:calc(.19s + var(--i,0)*69ms);will-change:transform}
  /* dots surgem com fade + leve escala */
  .anim-in .charts-grid .card.in-view .mcell{animation:dotIn .63s var(--ease) both;animation-delay:calc(.25s + var(--i,0)*50ms)}

  /* hover premium nos pontos: 100% → 125%, tooltip com fade (já existente) */
  .tm .nd{transition:transform .22s var(--ease),background .4s var(--ease),border-color .4s var(--ease),box-shadow .4s var(--ease)}
  .tm:hover .nd{transform:scale(1.25)}
  .mcell .md{transition:transform .22s var(--ease),background .3s var(--ease),border-color .3s var(--ease),box-shadow .3s var(--ease)}
  .mcell:hover .md{transform:scale(1.25)}

  /* acessibilidade: respeitar prefers-reduced-motion */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
    .anim-in .table-wrap,.anim-in .resumo-eyebrow,.anim-in .charts-grid .card,.anim-in tbody tr,.anim-in .mcell{opacity:1!important;transform:none!important}
    .anim-in .fill,.anim-in .hb-f{transform:none!important}
    .aurora::before,.aurora::after{animation:none!important}
  }

  /* ===== RODAPÉ ===== */
  .footer-simple{max-width:1200px;margin:16px auto 0;padding:18px 24px 40px;position:relative;z-index:5;
    border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .footer-left{display:flex;align-items:center;gap:10px}
  .footer-ln{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;
    border:1px solid var(--border2);color:var(--blue-soft);text-decoration:none;transition:all .15s var(--smooth);flex:none}
  .footer-ln:hover{border-color:var(--blue);background:rgba(47,128,208,.08)}
  .footer-ln svg{width:11px;height:11px;display:block}
  .footer-info{display:flex;align-items:center;gap:8px}
  .footer-info .fname{font-family:var(--f-b);font-size:11px;color:var(--t-1);font-weight:500;letter-spacing:.01em}
  .footer-info .frole{font-family:var(--f-b);font-size:11px;color:var(--t-3);letter-spacing:.01em}
  .footer-simple .fcopy{font-family:var(--f-m);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--t-muted)}

  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;box-shadow:0 0 0 0 rgba(63,166,107,.5);animation:livePulse 2.2s var(--smooth) infinite}
  @keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(63,166,107,.45)}70%{box-shadow:0 0 0 7px rgba(63,166,107,0)}100%{box-shadow:0 0 0 0 rgba(63,166,107,0)}}

  @media(max-width:768px){
    .topbar{padding:16px 20px} .container{padding:24px 16px 8px}

<script>
(function(){
  const stop=e=>{e.preventDefault();e.stopPropagation();return false;};

  document.addEventListener('keydown',function(e){

    if(c && e.shiftKey && ['i','j','c'].includes(k)) return stop(e);
  });
})();

const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function applyTheme(t){
  if(t==='light')document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')==='light'?'light':'dark';
  const next=cur==='light'?'dark':'light';
  try{localStorage.setItem('orbit-theme',next);}catch(e){}
  applyTheme(next);
  const y=window.scrollY;
  if(lastData)renderDashboard(lastData);
  window.scrollTo(0,y);
}
(function(){let t='dark';try{t=localStorage.getItem('orbit-theme')||'dark';}catch(e){}applyTheme(t);})();

const SHEET_ID='18yx-JEq4es3i7Xp47kxYTkh2cBvOJPoH';
const SHEET_NAME='Controle Geral';
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
const AUTO_REFRESH_MIN=10;

let lastData=null;
let firstRender=true;

function parseCSV(text){
  const rows=[];let cur='',inQ=false,row=[];
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(ch==='"'){if(inQ&&text[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if(ch===','&&!inQ){row.push(cur.trim());cur='';}
    else if(ch==='\n'&&!inQ){row.push(cur.trim());cur='';rows.push(row);row=[];}
    else cur+=ch;}
  if(cur||row.length){row.push(cur.trim());rows.push(row);}
  return rows;
}
function extractData(rows){
  return rows.slice(1).filter(r=>r[0]&&r[0].trim()!=='').map(r=>({
    nome:r[0]||'',status:r[1]||'',aguardando:r[2]||'',proximaAcao:r[3]||'',dataPublicacao:r[4]||'',
    doc:r[5]||'',kv:r[6]||'',imagens:r[7]||'',formulario:r[8]||'',sitelinks:r[9]||'',materiaisCompletos:r[10]||'',
    layoutIniciado:r[11]||'',layoutAprovado:r[12]||'',devIniciado:r[13]||'',formIntegrado:r[14]||'',
    scriptsAdicionados:r[15]||'',qaRealizado:r[16]||'',publicado:r[17]||'',clienteValidou:r[18]||''
  }));
}
const countBy=(a,k,v)=>a.filter(i=>i[k]===v).length;
const hasContent=v=>v&&v.trim()!==''&&v.trim()!=='—';

function statusBadge(s){
  const m={'Não iniciada':'b-gray','Recebimento de materiais':'b-orange','Layout + Desenvolvimento':'b-blue',
    'Aprovação do cliente':'b-amber','Ajustes':'b-amber','Recebimento do script':'b-purple',
    'Implementação do script':'b-purple','Publicada':'b-green','Finalizada':'b-green',
    'Enviada ao cliente para ajustes':'b-amber','Enviada ao cliente para a aprovação':'b-amber',
    'Cliente pediu novo ajuste':'b-orange'};
  return `<span class="badge ${m[s]||'b-gray'}">${s||'Não iniciada'}</span>`;
}

const STEPS=['layoutIniciado','layoutAprovado','devIniciado','formIntegrado','scriptsAdicionados','qaRealizado','publicado','clienteValidou'];
const STEP_LABELS=['Layout iniciado','Layout aprovado','Dev iniciado','Form integrado','Scripts','QA','Publicado','Validado'];

const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pctOf=d=>Math.round((STEPS.filter(s=>d[s]==='Sim').length/STEPS.length)*100);

function renderDashboard(data){
  lastData=data;
  const doAnim=firstRender;
  const total=data.length;
  const naoIniciadas=data.filter(d=>d.status==='Não iniciada'||!d.status).length;
  const emProducao=countBy(data,'status','Layout + Desenvolvimento')+countBy(data,'status','Recebimento de materiais');
  const bloqueadas=countBy(data,'aguardando','Aguardando FIA')+countBy(data,'aguardando','Aguardando Mkt')+countBy(data,'aguardando','Aguardando Mukutu');
  const publicadas=countBy(data,'status','Publicada')+countBy(data,'status','Finalizada');
  const agFIA=countBy(data,'aguardando','Aguardando FIA');
  const agMkt=countBy(data,'aguardando','Aguardando Mkt');
  const agMukutu=countBy(data,'aguardando','Aguardando Mukutu');
  const agTotal=agFIA+agMkt+agMukutu;
  const prodCounts=STEPS.map((s,i)=>({label:STEP_LABELS[i],count:data.filter(d=>d[s]==='Sim').length}));

  const statusColors={'Não iniciada':'#55606c','Recebimento de materiais':'#c47a4e','Layout + Desenvolvimento':'#2f80d0',
    'Aprovação do cliente':'#cba14e','Ajustes':'#cba14e','Recebimento do script':'#8a6fb0','Implementação do script':'#8a6fb0',
    'Publicada':'#3fa66b','Finalizada':'#3fa66b',
    'Enviada ao cliente para ajustes':'#cba14e','Enviada ao cliente para a aprovação':'#cba14e',
    'Cliente pediu novo ajuste':'#c47a4e'};
  const allStatuses=['Não iniciada','Recebimento de materiais','Layout + Desenvolvimento','Aprovação do cliente','Ajustes','Enviada ao cliente para ajustes','Enviada ao cliente para a aprovação','Cliente pediu novo ajuste','Recebimento do script','Implementação do script','Publicada','Finalizada'];
  let sc=allStatuses.map(s=>data.filter(d=>d.status===s).length);
  const emptyCount=data.filter(d=>!d.status||d.status.trim()==='').length;
  if(emptyCount>0)sc[0]+=emptyCount;
  const actIdx=allStatuses.map((s,i)=>i).filter(i=>sc[i]>0);
  const actStatuses=actIdx.map(i=>allStatuses[i]);
  const actCounts=actIdx.map(i=>sc[i]);

  const shown=data;

  /* ---- Resumo visual · 3 gráficos HTML (sempre visíveis) ---- */
  const barMax=Math.max(total,1);
  const shortStatus=s=>({'Recebimento de materiais':'Receb. materiais','Layout + Desenvolvimento':'Layout + Dev','Aprovação do cliente':'Aprovação cliente','Recebimento do script':'Receb. script','Implementação do script':'Implem. script','Enviada ao cliente para ajustes':'Env. p/ ajustes','Enviada ao cliente para a aprovação':'Env. p/ aprovação','Cliente pediu novo ajuste':'Novo ajuste'}[s]||s);
  const pipelineRows=allStatuses.map((s,i)=>({s,c:sc[i]})).filter(x=>x.c>0).map((x,i)=>{
    const w=Math.round(x.c/barMax*100),done=(x.s==='Publicada'||x.s==='Finalizada');
    return `<div class="hb" style="--i:${i}"><span class="hb-l" title="${esc(x.s)}">${esc(shortStatus(x.s))}</span><div class="hb-t"><div class="hb-f${done?' ok':''}" style="width:${w}%"></div></div><span class="hb-v">${x.c}</span></div>`;
  }).join('');
  const funnelRows=prodCounts.map((p,i)=>{
    const w=Math.round(p.count/barMax*100);
    return `<div class="hb" style="--i:${i}"><span class="hb-l" title="${esc(p.label)}">${esc(p.label)}</span><div class="hb-t"><div class="hb-f" style="width:${w}%"></div></div><span class="hb-v">${p.count}</span></div>`;
  }).join('');
  const MATKEYS=['doc','kv','imagens','formulario'],MATCAP=['Doc','KV','Img','Form'];
  const matRows=data.map((d,ri)=>{
    const vals=MATKEYS.map(k=>hasContent(d[k])?1:0),n=vals.reduce((a,b)=>a+b,0);
    const cls=n===4?'full':(n===0?'zero':'');
    const dots=vals.map((on,i)=>`<span class="mcell ${on?'on':''}" style="--i:${ri+i}" title="${MATCAP[i]}: ${on?'ok':'falta'}"><span class="md"></span></span>`).join('');
    return `<div class="mrow ${cls}"><span class="mlp">${esc(d.nome)}</span><div class="mdots">${dots}</div><span class="mcnt">${n}/4</span></div>`;
  }).join('');

  document.getElementById('content').innerHTML=`
    <div class="fade${doAnim?' anim-in':''}">


    <div class="table-wrap">
      <table><colgroup><col class="c-lp"><col class="c-sit"><col class="c-acao"><col class="c-etapas"><col class="c-prog"></colgroup><thead><tr>
        <th>LP</th><th>Situação</th><th>Próxima ação</th><th>Etapas</th><th>Progresso</th>
      </tr></thead><tbody>
        ${shown.map((d,idx)=>{
          const pct=pctOf(d);
          const done=STEPS.filter(k=>d[k]==='Sim').length;
          const col=pct===100?'var(--green)':pct>0?'var(--blue)':'var(--surface-3)';
          const stLow=(d.status||'').trim().toLowerCase();
          const isPub=stLow==='publicada'||stLow==='finalizada';
          const isIdle=stLow===''||stLow==='não iniciada';
          const rowCls=isPub?'published':(isIdle?'idle':'');
          const trail=STEPS.map((k,i)=>{
            const st=d[k];const cls=st==='Sim'?'on':st==='Não'?'no':'';
            return `<span class="tm ${cls}"><span class="nd"></span><span class="tip">${STEP_LABELS[i]}</span><span class="seg"></span></span>`;
          }).join('');
          return `<tr${rowCls?` class="${rowCls}"`:''} style="animation-delay:${idx*125}ms">
            <td><strong>${esc(d.nome)}</strong></td>
            <td>${statusBadge(d.status)}</td>
            <td class="td-acao">${hasContent(d.proximaAcao)?`<span class="acao-txt">${esc(d.proximaAcao)}</span><span class="otip">${esc(d.proximaAcao)}</span>`:`<span class="acao-txt" style="color:var(--t-muted)">—</span>`}</td>
            <td><div class="trail-mini">${trail}</div></td>
            <td><div class="pwrap"><div class="pbar"><div class="fill" style="width:${pct}%;--i:${idx};background:${col}"></div></div><span class="pct">${done}/${STEPS.length}</span></div></td>
          </tr>`;}).join('')}
      </tbody></table>
    </div>

    <div class="resumo-eyebrow">Resumo visual</div>
    <div class="charts-grid">
      <div class="card">
        <h3>Onde as LPs estão</h3>
        <div class="ccap">// pipeline · quantas LPs em cada estágio</div>
        <div class="hbars">${pipelineRows}</div>
        <div class="scalehint"><span>escala 0 → ${total} LPs</span></div>
      </div>
      <div class="card">
        <h3>Funil de produção</h3>
        <div class="ccap">// quantas LPs já passaram por cada fase</div>
        <div class="hbars">${funnelRows}</div>
        <div class="scalehint"><span>escala 0 → ${total} LPs</span></div>
      </div>
      <div class="card">
        <h3>Materiais por LP</h3>
        <div class="ccap">// completude dos 4 insumos — o que falta chegar</div>
        <div class="mhead"><span></span><div class="mdots-h"><span>Doc</span><span>KV</span><span>Img</span><span>Form</span></div><span class="mhead-r">de 4</span></div>
        <div class="mgrid">${matRows}</div>
      </div>
    </div>

    </div>`;

  markClippedCells();
  if(doAnim) setupReveal();
  firstRender=false;
}

/* reveal-on-scroll: anima cada seção quando entra na viewport (padrão Stripe/Linear) */
function setupReveal(){
  const targets=document.querySelectorAll('.anim-in .table-wrap, .anim-in .resumo-eyebrow, .anim-in .charts-grid .card');
  if(!('IntersectionObserver' in window)){targets.forEach(function(t){t.classList.add('in-view');});return;}
  const io=new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        e.target.classList.add('in-view');
        if(e.target.classList.contains('table-wrap'))runAnimations();
      }else{
        e.target.classList.remove('in-view');
      }
    });
  },{threshold:0,rootMargin:'0px 0px -10% 0px'});
  targets.forEach(function(t){io.observe(t);});
}

/* marca .is-clipped só nas células de "Próxima ação" cujo texto foi cortado */
function markClippedCells(){
  document.querySelectorAll('.td-acao').forEach(function(td){
    const t=td.querySelector('.acao-txt');
    td.classList.toggle('is-clipped', !!t && t.scrollWidth > t.clientWidth+1);
  });
}
/* re-avalia o corte quando a janela muda (coluna é percentual) */
(function(){
  let r;window.addEventListener('resize',function(){clearTimeout(r);r=setTimeout(markClippedCells,150);});
})();


async function loadData(){
  try{
    if(firstRender)document.getElementById('content').innerHTML='<div class="loading"><div class="spinner"></div><p style="font-family:var(--f-m);font-size:12px">Carregando dados do Google Sheets…</p></div>';
    const res=await fetch(CSV_URL);
    if(!res.ok)throw new Error('Não foi possível acessar a planilha');
    const data=extractData(parseCSV(await res.text()));
    renderDashboard(data);
    runAnimations();
    const now=new Date();
    document.getElementById('lastUpdate').textContent=`atualizado ${now.toLocaleDateString('pt-BR')} · ${now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
  }catch(err){
    document.getElementById('content').innerHTML=`<div class="loading">
      <p style="color:var(--red);font-family:var(--f-m);font-weight:600;font-size:13px">✕ Erro ao carregar dados</p>
      <p style="margin-top:10px;font-size:13px;color:var(--t-2)">${err.message}</p>
      <p style="margin-top:12px;font-size:12px;color:var(--t-3)">Verifique se a planilha está compartilhada como "Qualquer pessoa com o link pode ver".</p>
      <button style="margin-top:18px;font-family:var(--f-b);font-weight:600;font-size:12px;cursor:pointer;background:rgba(47,128,208,.1);color:var(--blue-soft);border:1px solid rgba(47,128,208,.28);border-radius:var(--r-full);padding:8px 18px" onclick="loadData()">Tentar novamente</button></div>`;
  }
}
loadData();
setInterval(loadData,AUTO_REFRESH_MIN*60*1000);

/* ===== CURSOR FOLLOWER ===== */
(function(){
  const c=document.getElementById('cursor');
  if(!c||window.matchMedia('(pointer:coarse)').matches)return;
  let mx=0,my=0,cx=0,cy=0;
  document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;if(!c.classList.contains('visible'))c.classList.add('visible');});
  document.addEventListener('mouseleave',function(){c.classList.remove('visible');});
  const hovers='a,button,.badge,.tm,.mcell,.hb,.footer-ln,.im';
  document.addEventListener('mouseover',function(e){if(e.target.closest(hovers))c.classList.add('hover');});
  document.addEventListener('mouseout',function(e){if(e.target.closest(hovers))c.classList.remove('hover');});
  (function loop(){cx+=(mx-cx)*.12;cy+=(my-cy)*.12;c.style.left=cx+'px';c.style.top=cy+'px';requestAnimationFrame(loop);})();
})();

/* ===== SCREEN NOTICE ===== */
(function(){
  var n=document.getElementById('screenNotice');
  var btn=document.getElementById('screenNoticeClose');
  if(!n||!btn)return;
  var isTouch=window.matchMedia('(hover: none)').matches;
  if(!isTouch){n.style.display='none';return;}
  setTimeout(function(){n.style.display='block';setTimeout(function(){n.classList.add('visible');},100);},800);
  btn.addEventListener('click',function(){n.classList.remove('visible');setTimeout(function(){n.style.display='none';},350);});
})();

/* ===== ANIMATIONS ===== */
/* Números com contagem crescente (se houver [data-count]); barras animam via CSS (scaleX, GPU) */
function runAnimations(){
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  document.querySelectorAll('[data-count]').forEach(function(el){
    const target=parseInt(el.dataset.count,10);
    if(isNaN(target)){return;}
    if(reduce||target===0){el.textContent=String(target||0);return;}
    const dur=1400;const start=performance.now();
    (function tick(now){
      const p=Math.min((now-start)/dur,1);
      const ease=1-Math.pow(1-p,3);
      el.textContent=String(Math.round(ease*target));
      if(p<1)requestAnimationFrame(tick);
    })(start);
  });
}
</script>
