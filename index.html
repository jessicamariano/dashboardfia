            *{margin:0;padding:0;box-sizing:border-box}
            .staticrypt-html{height:100%}

            .staticrypt-content{
                height:100%;display:flex;align-items:center;justify-content:center;

                font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
            }
            .staticrypt-page{width:100%;max-width:380px;padding:24px}
            .staticrypt-form{
                background:#11161d;border:1px solid #1e2732;border-radius:12px;padding:48px 36px 40px;text-align:center;
                box-shadow:0 14px 40px rgba(0,0,0,.55);position:relative;overflow:hidden;
            }
            .staticrypt-form::before{
                content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#2f80d0,transparent);
            }
            .sc-logo{width:56px;height:56px;margin:0 auto 20px;position:relative}
            .sc-logo::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(47,128,208,.1),transparent 62%);pointer-events:none}
            .sc-logo svg{display:block;position:relative;z-index:1}
            .staticrypt-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:24px;font-weight:800;letter-spacing:-.03em;color:#e7edf3;margin-bottom:4px}
            .staticrypt-title b{color:#2f80d0}
            .staticrypt-instructions{margin-bottom:28px}
            .staticrypt-instructions p:last-child{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;color:#6b7680;margin-top:8px}
            .staticrypt-hr{display:none}
            .staticrypt-password-container{
                position:relative;background:#161d26;border:1px solid #2a3644;border-radius:8px;
                margin:0 0 16px;transition:border-color .2s;
            }
            .staticrypt-password-container:focus-within{border-color:#2f80d0}
            .staticrypt-form input[type="password"],input[type="text"]{
                background:transparent;border:0;outline:0;width:100%;padding:14px 42px 14px 16px;
                font-family:'IBM Plex Mono',monospace;font-size:14px;color:#e7edf3;letter-spacing:.08em;
            }
            .staticrypt-form input::placeholder{color:#55606c;letter-spacing:.06em}
            .staticrypt-toggle-password-visibility{
                cursor:pointer;height:18px;width:18px;opacity:.4;padding:0;position:absolute;right:14px;top:50%;transform:translateY(-50%);
                transition:opacity .2s;filter:invert(1);
            }
            .staticrypt-toggle-password-visibility:hover{opacity:.7}
            .staticrypt-form .staticrypt-decrypt-button{
                width:100%;padding:13px;border:none;border-radius:8px;
                background:rgba(47,128,208,.15);color:#6fa8dc;font-family:'IBM Plex Mono',monospace;
                font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
                cursor:pointer;transition:all .15s ease;border:1px solid rgba(47,128,208,.28);
            }
            .staticrypt-form .staticrypt-decrypt-button:hover{background:rgba(47,128,208,.25);border-color:rgba(47,128,208,.5);color:#e7edf3}
            label.staticrypt-remember{display:none!important}
            .hidden{display:none!important}
            .staticrypt-spinner-container{height:100%;display:flex;align-items:center;justify-content:center;background:#0b0f14}
            .staticrypt-spinner{width:2rem;height:2rem;border:2px solid #1e2732;border-top-color:#2f80d0;border-radius:50%;animation:spin .8s linear infinite}
            @keyframes spin{to{transform:rotate(360deg)}}
            .sc-footer{margin-top:24px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#55606c}
            .sc-error{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#c65a52;margin-top:12px;display:none}
